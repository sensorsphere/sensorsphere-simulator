services:
  sensor-simulator:
    image: "${SIMULATOR_IMAGE:-ghcr.io/sensorsphere/sensorsphere-simulator:1.3.0}"
    restart: unless-stopped
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-8090}:8090"
    environment:
      PORT: "8090"
      MQTT_HOST: "${SIMULATOR_MQTT_HOST:-192.168.0.5}"
      MQTT_PORT: "${SIMULATOR_MQTT_PORT:-1883}"
      MQTT_USERNAME: "${SIMULATOR_MQTT_USERNAME:-}"
      MQTT_PASSWORD: "${SIMULATOR_MQTT_PASSWORD:-}"
      MQTT_TOPIC_PREFIX: "${MQTT_TOPIC_PREFIX:-sensors/ble_gateway/ble-gateway-01/sensor}"
      APP_INSTANCE_NAME: "${APP_INSTANCE_NAME:-DEV}"
      LOG_RETENTION_MINUTES: "${LOG_RETENTION_MINUTES:-60}"
      LOG_LIMIT: "${LOG_LIMIT:-10000}"
      SIMULATOR_BACKUP_INTERVAL_MINUTES: "${SIMULATOR_BACKUP_INTERVAL_MINUTES:-5}"
      SIMULATOR_BACKUP_RETENTION: "${SIMULATOR_BACKUP_RETENTION:-288}"
      DATA_FILE: "/app/data/simulator.json"
    volumes:
      - ./data:/app/data
