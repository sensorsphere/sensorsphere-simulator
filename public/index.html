<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SensorSphere Simulator</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" type="image/svg+xml" sizes="any" href="/sensorsphere-simulator.svg?v=15">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=15">
  <link rel="shortcut icon" href="/favicon-32.png?v=15">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=15">
</head>
<body>
<header>
  <div class="brand">
    <div>
      <div class="brand-title"><img class="brand-logo" src="/sensorsphere-simulator.svg" alt=""><h1>SensorSphere Simulator</h1></div>
      <p>MQTT test bench</p>
    </div>

    <span
      id="buildVersion"
      class="build-version"
    >
      SIM-015 - build 015
    </span>
  </div>

  <div id="mqtt" class="status">
    MQTT …
  </div>
</header>
<main>

  <nav class="main-tabs">
    <button class="main-tab active" data-tab="basic" onclick="selectMainTab('basic')">
      Basic injection
    </button>
    <button class="main-tab" data-tab="scenarios" onclick="selectMainTab('scenarios')">
      Scenarios
    </button>
    <button class="main-tab" data-tab="logs" onclick="selectMainTab('logs')">
      Publication log
    </button>
  </nav>

  <section id="tab-basic" class="tab-panel">
    <section class="toolbar">
      <button class="primary" onclick="addSensor()">+ Add sensor</button>
      <button class="btn-start" onclick="action('/api/start-all')">▶ Start all</button>
      <button class="btn-stop" onclick="action('/api/stop-all')">■ Stop all</button>
      <button class="btn-publish" onclick="action('/api/publish-all')">Publish all now</button>
    </section>
    <div id="sensors"></div>
  </section>

  <section id="tab-scenarios" class="tab-panel" hidden>
  <section class="scenarios">
    <div class="section-title">
      <div>
        <h2>Scenarios</h2>
        <span>Automated sensor and metric changes</span>
      </div>

      <button
        class="primary"
        onclick="addScenario()"
      >
        + Add scenario
      </button>
    </div>

    <div id="scenarios"></div>
  </section>
  </section>

  <section id="tab-logs" class="tab-panel" hidden>
  <section class="logs">
    <div class="section-title">
      <div>
        <h2>Publication log</h2>
        <span>Latest MQTT activity</span>
      </div>
      <button onclick="clearLogs()">Clear</button>
    </div>

    <div class="log-filters">
      <label>
        Period
        <select id="logPeriod" onchange="renderLogs()">
          <option value="1">Last 1 minute</option>
          <option value="2">Last 2 minutes</option>
          <option value="5" selected>Last 5 minutes</option>
          <option value="10">Last 10 minutes</option>
        </select>
      </label>

      <label>
        Sensor
        <select id="logSensor" onchange="renderLogs()">
          <option value="">All sensors</option>
        </select>
      </label>

      <label>
        Metric
        <select id="logMetric" onchange="renderLogs()">
          <option value="">All metrics</option>
        </select>
      </label>

      <label>
        Status
        <select id="logStatus" onchange="renderLogs()">
          <option value="">All statuses</option>
          <option value="OK">OK</option>
          <option value="INFO">INFO</option>
          <option value="ERROR">ERROR</option>
        </select>
      </label>

      <span id="logCount" class="log-count"></span>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Time</th>
            <th>Sensor</th>
            <th>Metric</th>
            <th>Value</th>
            <th>Status</th>
            <th>Topic / message</th>
          </tr>
        </thead>
        <tbody id="logRows"></tbody>
      </table>
    </div>
  </section>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
