<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SensorSphere Simulator</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<header>
  <div><h1>SensorSphere Simulator</h1><p>MQTT test bench</p></div>
  <div id="mqtt" class="status">MQTT …</div>
</header>
<main>
  <section class="toolbar">
    <button class="primary" onclick="addSensor()">+ Add sensor</button>
    <button onclick="action('/api/start-all')">▶ Start all</button>
    <button onclick="action('/api/stop-all')">■ Stop all</button>
    <button onclick="action('/api/publish-all')">Publish all now</button>
  </section>
  <div id="sensors"></div>
  <section class="logs">
    <div class="section-title"><div><h2>Publication log</h2><span>Latest MQTT activity</span></div>
      <button onclick="clearLogs()">Clear</button></div>
    <div class="table-wrap"><table><thead><tr><th>Time</th><th>Sensor</th><th>Metric</th><th>Value</th><th>Status</th><th>Topic / message</th></tr></thead><tbody id="logRows"></tbody></table></div>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
